# 物归 生产环境部署配置
# 使用方式（1panel Compose 或命令行）：
#   1. 把整个 deploy/ 目录放到服务器，如 /opt/wugui/deploy
#   2. cp .env.example .env 并按需修改
#   3. docker compose up -d
name: wugui

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    container_name: wugui-mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max_connections=100
      - --innodb-buffer-pool-size=256M
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set in .env}
      MYSQL_DATABASE: wugui
      MYSQL_USER: wugui
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set in .env}
    volumes:
      - mysql-data:/var/lib/mysql
    # 生产不暴露到宿主机，仅内部网络访问
    networks: [wugui-net]
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-uroot', '-p${MYSQL_ROOT_PASSWORD}']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    container_name: wugui-api
    env_file: .env
    environment:
      DATABASE_URL: mysql://wugui:${MYSQL_PASSWORD}@mysql:3306/wugui
      NODE_ENV: production
      PORT: 3000
    depends_on:
      mysql:
        condition: service_healthy
    # 只暴露给 nginx 访问
    expose:
      - '3000'
    networks: [wugui-net]
    deploy:
      resources:
        limits:
          memory: 512M

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    container_name: wugui-nginx
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - logs:/var/log/nginx
    depends_on:
      - api
    networks: [wugui-net]

networks:
  wugui-net:
    driver: bridge

volumes:
  mysql-data:
  logs:
